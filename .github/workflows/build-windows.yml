name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    # 历史标签既有 v1.2.3 也有 V1.2.3，两种大小写都要能触发（github 的 glob 区分大小写）
    tags: [ 'v*', 'V*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Tauri 版（multifun_serial）的 MSI 安装包，先跑：
  # Rust 全量编译最容易出问题，先验证它，失败就不用再花时间打 Python 包了。
  # 日常 push / PR 也编译（有 rust-cache，增量一两分钟）；
  # 打标签时 MSI 交给 release.yml 统一构建，这里跳过，避免同一份产物编两遍。
  build-tauri-msi:
    if: ${{ github.ref_type != 'tag' }}
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: multifun_serial/package-lock.json

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: multifun_serial/src-tauri -> target

    - name: Install frontend dependencies
      working-directory: multifun_serial
      run: npm ci

    # 产物版本就是 tauri.conf.json 里写死的值（现在是 2.0.0）；
    # 需要按 tag 改版本号的话走 release.yml，那边有 Sync app version from tag。
    # beforeBuildCommand（npm run build:web）会顺带跑 tsc + vite build
    - name: Build MSI
      working-directory: multifun_serial
      run: npm run tauri -- build --bundles msi

    - name: Upload MSI
      uses: actions/upload-artifact@v7
      with:
        name: multifun-serial-msi
        path: multifun_serial/src-tauri/target/release/bundle/msi/*.msi
        if-no-files-found: error

  # PySide6 版的单文件 exe，等 MSI 编译通过后再跑（needs 保证串行，MSI 失败就不打包）。
  # 打标签时发版统一交给 release.yml，这里跳过，避免同一份 PyInstaller 跑两遍。
  # 用 ref_type 而不是 startsWith('refs/tags/v')：后者区分大小写，V2.0.0 这类标签会漏判
  build:
    needs: build-tauri-msi
    if: ${{ github.ref_type != 'tag' }}
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: debug_tool
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r packaging/requirements.txt

    # spec 默认 onefile，产物就是单个 dist/TcpTool.exe
    - name: Build EXE
      working-directory: debug_tool
      run: |
        python -m PyInstaller --noconfirm packaging/TcpTool.spec

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: TcpTool-Windows
        # 单文件 exe，不再压缩；Actions 下载 artifact 时平台会自行包一层 zip
        path: debug_tool/dist/TcpTool.exe
        if-no-files-found: error
