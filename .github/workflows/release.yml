  #     uses: actions/upload-artifact@v4
  #     with:
  #       name: linux-arm-build
  #       path: debug_tool/dist/TcpTool-Linux-ARM

  release:
    needs: [build-windows, build-tauri-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-build
        path: artifacts

    - name: Download MSI artifact
      uses: actions/download-artifact@v4
      with:
        name: multifun-serial-msi
        path: artifacts
    
    # - name: Download Linux ARM artifact
    #   uses: actions/download-artifact@v4
    #   with:
    #     name: linux-arm-build
    #     path: artifacts
    
    - name: Get tag name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag || github.event.release.tag_name }}
        files: |
          artifacts/TcpTool.zip
          artifacts/*.msi
        draft: false
        prerelease: false
        generate_release_notes: true
