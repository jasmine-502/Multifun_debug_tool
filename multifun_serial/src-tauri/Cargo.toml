[package]
name = "multifun-serial"
version = "2.0.0"
description = "Multifun Serial 串口工具（Tauri + React；debug_tool 串口页的重写版）"
authors = ["Multifun_debug_tool"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "multifun_serial_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
chrono = "0.4"
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
